map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8088 default_server;
    listen [::]:8088 default_server;

    server_name _;
    port_in_redirect off;

    # 1. Main Home Portal
    location / {
        root /var/www/nexus-portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Aquarium (ESP8266 controller on 192.168.1.32)
    location /aquarium/ {
        proxy_pass http://192.168.1.32/;
        proxy_set_header Host 192.168.1.32;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
    location = /aquarium {
        return 301 /aquarium/;
    }

    # Aquarium REST APIs
    location /api/ {
        proxy_pass http://192.168.1.32/api/;
        proxy_set_header Host 192.168.1.32;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # 3. TeslaMate (Phoenix Server on port 4000)
    location /teslamate/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location = /teslamate {
        return 301 /teslamate/;
    }

    # TeslaMate Direct/Fallback Asset & WebSocket Proxy
    location /assets/ {
        proxy_pass http://127.0.0.1:4000/assets/;
        proxy_set_header Host $http_host;
    }
    location /images/ {
        proxy_pass http://127.0.0.1:4000/images/;
        proxy_set_header Host $http_host;
    }
    location /live/ {
        proxy_pass http://127.0.0.1:4000/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location /settings {
        proxy_pass http://127.0.0.1:4000/settings;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /geo-fences {
        proxy_pass http://127.0.0.1:4000/geo-fences;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 4. Grafana (Port 3000)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location = /grafana {
        return 301 /grafana/;
    }
}

